name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Critical for fetching llama.cpp if it's a submodule

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # cache: gradle (Removed until gradle-wrapper.properties is present)

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Vulkan SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools glslc libvulkan-dev spirv-headers spirv-tools libglslang-dev || sudo apt-get install -y glslang-tools shaderc libvulkan-dev spirv-headers spirv-tools libglslang-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK with NDK
        run: gradle assembleDebug --stacktrace > build_log.txt 2>&1

      - name: Push log to build-logs branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b build-logs || git checkout build-logs
          git add build_log.txt
          git commit -m "Upload build log [skip ci]" || true
          git push origin HEAD:build-logs -f

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
