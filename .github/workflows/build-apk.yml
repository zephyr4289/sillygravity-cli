name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Critical for fetching llama.cpp if it's a submodule

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # cache: gradle (Removed until gradle-wrapper.properties is present)

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Note: For NDK r26b, it is highly recommended to specify `ndkVersion "26.1.10909125"` 
      # inside your app/build.gradle. Gradle will automatically download and use it.

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK with NDK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
